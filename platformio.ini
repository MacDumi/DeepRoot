; ---------------------------------------------------------------------------
; Matter Soil Sensor — Seeed XIAO Soil Moisture Sensor (ESP32-C6)
;
; ESP-IDF 6.0 does NOT work with esp-matter (removed `json` component, split
; `driver`). Stay on 5.4.x / 5.5.x.
; ---------------------------------------------------------------------------

[platformio]
; Standard ESP-IDF layout uses main/, PlatformIO defaults to src/.
src_dir = main

[env:xiao_soil_sensor]
platform = espressif32 @ 6.12.0
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = espidf

board_build.partitions = partitions.csv
monitor_speed = 115200

; PlatformIO drops CMake add_custom_command() rules when it re-implements the
; build in SCons, so ESP-IDF's target_add_binary_data() outputs are never
; generated (esp_insights embeds a server cert this way). See the script.
extra_scripts = post:tools/pio_embed_binary_data.py